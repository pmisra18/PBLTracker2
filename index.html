<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lock-In Study Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .dashboard-container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-size: 1.8rem; margin-bottom: 5px; color: #38bdf8; }
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background-color: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { margin-bottom: 16px; font-size: 1.2rem; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        #timer-display { font-size: 3rem; font-weight: bold; text-align: center; margin: 20px 0; color: #38bdf8; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; background-color: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #2563eb; }
        button.secondary { background-color: #475569; }
        button.secondary:hover { background-color: #334155; }
        .tracker-input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        input { padding: 10px; border-radius: 6px; border: 1px solid #475569; background-color: #0f172a; color: white; }
        #sheet-status { font-size: 0.9rem; color: #94a3b8; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>Lock-In Study Dashboard</h1>
            <p>Your Mobile & Desktop Command Center</p>
        </header>
        <main class="grid-layout">
            <!-- Pomodoro Timer Card -->
            <section class="card">
                <h2>Pomodoro Timer</h2>
                <div id="timer-display">25:00</div>
                <div class="btn-group">
                    <button id="start-timer">Start</button>
                    <button id="reset-timer" class="secondary">Reset</button>
                </div>
            </section>

            <!-- Tracker / Deficit Card -->
            <section class="card">
                <h2>PBL Tracker Status</h2>
                <div class="tracker-input-group">
                    <input type="text" id="sheet-url" placeholder="Paste Google Sheet CSV URL here">
                    <button id="load-sheet">Sync Tracker</button>
                </div>
                <div id="sheet-status">Connect your tracking sheet to monitor tasks and see how far behind schedule you are.</div>
            </section>
        </main>
    </div>

    <script>
        // Pomodoro Logic
        let timeLeft = 25 * 60;
        let timerInterval = null;
        const timerDisplay = document.getElementById('timer-display');
        const startButton = document.getElementById('start-timer');
        const resetButton = document.getElementById('reset-timer');

        function updateTimerDisplay() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }

        startButton.addEventListener('click', () => {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    alert('Session complete! Take a break.');
                }
            }, 1000);
        });

        resetButton.addEventListener('click', () => {
            clearInterval(timerInterval);
            timerInterval = null;
            timeLeft = 25 * 60;
            updateTimerDisplay();
        });

        // Sheet Sync Simulation
        document.getElementById('load-sheet').addEventListener('click', () => {
            const url = document.getElementById('sheet-url').value;
            const statusDiv = document.getElementById('sheet-status');
            if(!url) {
                statusDiv.textContent = "Please enter a valid link to sync.";
                return;
            }
            statusDiv.textContent = "Syncing with Google Sheets tracker... Connected successfully!";
        });
    </script>
</body>
</html>
